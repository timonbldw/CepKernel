# This is a basic workflow to help you get started with Actions
name: build

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

env:
  CLANG_VERSION: "17.0.2"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update submodules
        run: git submodule update --init --recursive --remote

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            libyaml-dev ccache zip python3 curl wget xz-utils

      - name: Download and install Clang ${{ env.CLANG_VERSION }}
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${CLANG_VERSION}/clang%2Bllvm-${CLANG_VERSION}-x86_64-linux-gnu-ubuntu-22.04.tar.xz" \
            -o /tmp/clang.tar.xz
          sudo mkdir -p /opt/clang
          sudo tar xf /tmp/clang.tar.xz -C /opt/clang --strip-components=1
          rm /tmp/clang.tar.xz
          echo "/opt/clang/bin" >> "$GITHUB_PATH"

      - name: Verify clang installation
        run: clang --version | head -1

      - name: Build kernel
        run: bash ./build.sh

      - name: Build NetHunter kernel
        run: |
          cp mi9_nethunter_buildconfig kali-nethunter-kernel/config
          sed -i 's|${TD}/clang+llvm-17.0.2-x86_64-linux-gnu-ubuntu-22.04|/opt/clang|g' kali-nethunter-kernel/config
          bash ./kali-nethunter-kernel/build.sh

      - name: Release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: false
          files: |
            kernel_out/*.zip
            kali-nethunter-kernel/output/*.zip
